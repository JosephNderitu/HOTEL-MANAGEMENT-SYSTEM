{# restricted.html #}
{% extends "dashboard/base_dashboard.html" %}
{% block dashboard_content %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-5">
        <i class="fa-solid fa-lock text-2xl text-red-500"></i>
    </div>
    <h1 class="text-xl font-bold text-black mb-2">Access Restricted</h1>
    <p class="text-gray-500 text-sm">You don't have permission to access {{ module_label }}. Contact your manager or the super admin if you believe this is a mistake.</p>
</div>
{% endblock %}
