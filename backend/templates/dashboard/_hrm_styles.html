<style>
    :root {
        --hrm-primary: #0B6B3A;
        --hrm-primary-dark: #074726;
        --hrm-accent: #C9A227;
        --hrm-accent-hover: #b08d1f;
        --hrm-slate-900: #0f172a;
        --hrm-slate-800: #1e293b;
        --hrm-slate-100: #f1f5f9;
        --hrm-card-bg: rgba(255, 255, 255, 0.95);
    }

    /* Glassmorphism Hero Section */
    .hr-hero-card {
        background: linear-gradient(135deg, #0B6B3A 0%, #074726 50%, #042e18 100%);
        box-shadow: 0 10px 30px -10px rgba(11, 107, 58, 0.4);
        position: relative;
        overflow: hidden;
    }

    .hr-hero-card::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(201, 162, 39, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    /* Advanced Interactive Cards */
    .hr-tile {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }

    .hr-tile:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        border-color: rgba(11, 107, 58, 0.3);
    }

    .hr-tile-accent:hover {
        border-color: rgba(201, 162, 39, 0.4);
    }

    .hr-icon-wrapper {
        transition: transform 0.25s ease;
    }

    .hr-tile:hover .hr-icon-wrapper {
        transform: scale(1.1);
    }

    /* Status Pulse Badges */
    .status-pulse-active {
        position: relative;
    }
    .status-pulse-active::after {
        content: '';
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        right: 2px;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        animation: hr-pulse 1.8s infinite;
    }

    @keyframes hr-pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Custom Scrollbar for Shift Feeds */
    .custom-scrollbar::-webkit-scrollbar {
        height: 5px;
        width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    /* Mode-select cards (self vs trade) */
    .hr-mode-card {
        cursor: pointer;
        border: 1.5px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 0.9rem 1rem;
        transition: all 0.2s ease;

    .hr-mode-card:hover { border-color: rgba(11,107,58,0.4); }
    .hr-mode-card.hr-mode-active {
        border-color: #0B6B3A;

        box-shadow: 0 0 0 3px rgba(11,107,58,0.08);

    /* Weekday chip checkboxes */
    .hr-day-chip { display: inline-flex; }

        padding: 0.5rem 0.9rem;
        border-radius: 9999px;
        border: 1.5px solid #e2e8f0;
        font-size: 0.75rem;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .hr-day-chip input:checked + span {
        background: #0B6B3A;
        border-color: #0B6B3A;
        color: #fff;

    /* Timeline-style shift card */
    .hr-shift-card {
        border-left: 4px solid #0B6B3A;
        background: #fff;
        border-radius: 0 0.75rem 0.75rem 0;

    /* Stat pill in hero */
    .hr-stat-pill {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.15);
    }

    /* Calendar grid */
    .hr-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
    .hr-cal-cell { min-height: 96px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 6px; background: #fff; transition: all .2s ease; }
    .hr-cal-cell.hr-cal-muted { background: #f8fafc; opacity: .5; }

    .hr-cal-chip { font-size: 10px; padding: 2px 6px; border-radius: 999px; display: flex; align-items: center; gap: 4px; margin-bottom: 3px; cursor: pointer; background: #f1f5f9; color: #334155; text-decoration: none; }
    .hr-cal-chip:hover { background: #e2e8f0; }

    .hr-cal-dot-day { background: #C9A227; }
    .hr-cal-dot-night { background: #1e293b; }

    /* Countdown */
    .hr-countdown-box { background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 16px; text-align: center; min-width: 68px; }
    .hr-countdown-num { font-size: 1.5rem; font-weight: 800; line-height: 1; }
    .hr-countdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }

    /* Balance chip */
    .hr-balance-chip { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #f1f5f9; color: #334155; font-weight: 600; white-space: nowrap; }

    /* Avatar */
    .hr-avatar { width: 36px; height: 36px; border-radius: 50%; background: #0B6B3A; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

    /* Filter inputs */
    .hr-filter-input {

        padding: 0.55rem 0.75rem; font-size: 0.8rem; color: #334155; background: #fff;
        transition: border-color .15s ease;

    .hr-filter-input:focus { outline: none; border-color: #0B6B3A; box-shadow: 0 0 0 3px rgba(11,107,58,0.08); }

    /* Pagination */
    .hr-page-btn {

        min-width: 32px; height: 32px; padding: 0 0.6rem; border-radius: 0.5rem;

        transition: all .15s ease;
    }

    .hr-page-btn.hr-page-active { background: #0B6B3A; border-color: #0B6B3A; color: #fff; }
    .hr-page-btn.hr-page-disabled { opacity: 0.35; pointer-events: none; }

    /* Segmented tabs */
    .hr-seg-group { display: inline-flex; background: #f1f5f9; border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .hr-seg-btn { font-size: 0.72rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 999px; color: #64748b; transition: all .15s ease; }
    .hr-seg-btn.hr-seg-active { background: #0B6B3A; color: #fff; box-shadow: 0 2px 6px rgba(11,107,58,0.25); }

    /* Refined calendar */
    .hr-cal-cell { min-height: 108px; }

    .hr-cal-today-badge { background: #0B6B3A; color: #fff; border-radius: 999px; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }

    /* Empty states */
    .hr-empty-state { text-align: center; padding: 2.5rem 1rem; color: #94a3b8; }
    .hr-empty-state i { font-size: 1.75rem; margin-bottom: 0.5rem; display: block; opacity: 0.5; }

    /* Live shift status hero */
    .hr-shift-status-badge { font-size: 0.85rem; font-weight: 700; padding: 0.4rem 1rem; border-radius: 999px; display: inline-flex; align-items: center; gap: 0.4rem; }
    .hr-status-ontime { background: rgba(16,185,129,0.15); color: #10b981; }
    .hr-status-late { background: rgba(239,68,68,0.15); color: #ef4444; }
    .hr-status-upcoming { background: rgba(201,162,39,0.15); color: #C9A227; }
    .hr-live-clock { font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 800; letter-spacing: 0.02em; }

    /* Geofence radar */
    .hr-radar-wrap { width: 220px; height: 220px; margin: 0 auto; position: relative; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 70%); }
    .hr-radar-ring { position: absolute; top: 50%; left: 50%; border: 2px dashed rgba(201,162,39,0.5); border-radius: 50%; transform: translate(-50%, -50%); }
    .hr-radar-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #C9A227; box-shadow: 0 0 0 6px rgba(201,162,39,0.2); }
    .hr-radar-marker { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); transition: all 0.4s ease; box-shadow: 0 0 0 5px currentColor, 0 0 12px currentColor; }
    .hr-radar-marker.hr-radar-in { background: #10b981; color: rgba(16,185,129,0.25); }
    .hr-radar-marker.hr-radar-out { background: #ef4444; color: rgba(239,68,68,0.25); }
    .hr-radar-marker::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; animation: hr-pulse 1.8s infinite; }

    /* Verify inputs */
    .hr-verify-input { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15); color: #fff; border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 0.9rem; width: 100%; }
    .hr-verify-input::placeholder { color: rgba(255,255,255,0.4); }
    .hr-verify-input:focus { outline: none; border-color: #C9A227; }

    .hr-rank-owner { background: linear-gradient(135deg,#C9A227,#8f7115); color:#fff; }
    .hr-rank-manager { background: rgba(11,107,58,0.12); color:#0B6B3A; }
    .hr-role-pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; font-weight: 600; }

    .hr-timeline { position: relative; padding-left: 1.25rem; }
    .hr-timeline::before { content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:#e2e8f0; }
    .hr-timeline-item { position: relative; padding-bottom: 1.1rem; }
    .hr-timeline-item::before { content:''; position:absolute; left:-1.25rem; top:3px; width:9px; height:9px; border-radius:50%; background:#0B6B3A; border:2px solid #fff; box-shadow:0 0 0 1px #e2e8f0; }
    .hr-timeline-item.hr-timeline-negative::before { background:#dc2626; }

    .hr-status-chip { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

    .hr-status-late { background: rgba(245,158,11,0.15); color: #b45309; }
    .hr-status-absent { background: rgba(220,38,38,0.12); color: #dc2626; }
    .hr-status-on_leave { background: rgba(201,162,39,0.15); color: #8f7115; }
    .hr-status-weekly_off { background: #f1f5f9; color: #64748b; }
    .hr-status-not_due { background: rgba(59,130,246,0.1); color: #2563eb; }

    .hr-stat-mini p:first-child { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .hr-stat-mini p:last-child { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .65; margin-top: 2px; }
</style>
